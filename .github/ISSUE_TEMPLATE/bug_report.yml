name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most KrnlSentry bugs turn out to be
        kernel-environment specific, so the environment section below is
        usually the fastest route to a diagnosis — please fill it in even if
        the problem seems unrelated.

        **Security vulnerabilities do not belong here.** See
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full error output. For a BPF verifier rejection, paste the entire log — the useful part is rarely at the end.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sudo ./bin/krnlsentry --rules reverse-shell
        2. sudo ./test/04-reverse-shell.sh
        3. no alert appears
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please run this and paste the output verbatim.
      value: |
        <!-- Paste the output of:

        uname -srm
        cat /etc/os-release | head -2
        ls -l /sys/kernel/btf/vmlinux
        ./bin/krnlsentry --version
        clang --version | head -1

        -->
      render: shell
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it?
      options:
        - Directly on a Linux host
        - Docker / Podman container
        - Colima or Lima VM on macOS
        - Virtual machine (other)
        - Other
    validations:
      required: true
